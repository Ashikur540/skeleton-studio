##
# Runs the app on the server. Image is built and pushed by GitHub Actions.
#
#   docker compose pull && docker compose up -d
#
# Port mapping is HOST:CONTAINER. Host 5000 is the address nginx already
# proxies to, so nginx needs no change. Container 3000 is where Next listens.
##

services:
  web:
    image: ghcr.io/ashikur540/skeleton-studio:latest
    container_name: skeleton-studio
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
